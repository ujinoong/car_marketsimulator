name: Refresh Nemotron Persona Cache
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch dispersed synthetic persona sample
        run: python scripts/build_nemotron_cache.py
      - name: Commit cache when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nemotron_persona_cache.json
          git diff --cached --quiet || (git commit -m "Refresh Nemotron persona cache" && git push)
